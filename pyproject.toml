[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potencyguard"
version = "0.0.0"
description = "PotencyGuard prototype (SAP Hackfest 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "cryptography==50.0.2",
]

[tool.setuptools]
packages = ["shared", "simulator", "edge", "planner", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

