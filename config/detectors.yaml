# Settings of the four tamper detectors (Phase 3). Simulation only.
# Every value is placeholder, not sourced [SOURCE NEEDED].

# CUSUM drift detector: reference value k and decision threshold h, in units of the residual
# standard deviation. Chosen by the sweep in scripts/evaluate_detectors.py (rule: false alarms at
# most the target below, then the smallest median delay; see the Phase 3 report). A test repeats
# the selection and checks it agrees with these values.
cusum_k: 0.25
cusum_h: 4.0

# The CUSUM statistic is capped at cusum_cap_factor * h, so an alarm clears soon after the
# residuals return to normal instead of staying up for hundreds of samples.
cusum_cap_factor: 2.0

# Target used by the selection rule: the largest acceptable number of false CUSUM alarm
# episodes per 1000 simulated hours on clean runs.
cusum_false_alarm_target_per_1000h: 1.0

# Impossible-step detector: tolerance added to the physical step bound, in residual std deviations.
step_tolerance_sigma: 5.0

# MEANING: the largest sudden warming of the box, in kelvin, that an unseen heat load can cause in
# one sample interval. The twin cannot observe such a load (a door held open), so the impossible-
# step bound's warm end is raised by this amount above ambient.
# DERIVATION (simulator-matching value): a heat load of P watts through the wall resistance R_th
# can pull the box towards at most R_th * P kelvin above where it would otherwise settle, so in
# any single interval it cannot add more than that:
#     heat_allowance_c = box_R_th_k_per_w * door_max_power_w = 0.5 K/W * 120 W = 60 K
# door_max_power_w (config/product_default.yaml) is the largest door power the injectable
# open_door command accepts, and the largest any shipped scenario uses. A test asserts that this
# value is at least R_th * door_max_power_w and at most 1.5 times that, so it stays tied to the
# simulator. It is a design allowance for THIS synthetic box; a real box needs its own value.
# placeholder, not sourced [SOURCE NEEDED]
heat_allowance_c: 60.0

# Impossible-state detector: the reported temperature is below the lag-aware lower envelope (the
# coldest the box could be with full cooling all the time, from the first reading) by more than
# margin_sigma residual std deviations, for this many samples in a row.
state_margin_sigma: 6.0
state_consecutive_samples: 3

# Once a falsification verdict is reached it is held for at least this many samples, so the verdict
# does not flicker while the CUSUM statistics settle.
falsification_hold_samples: 6

# Flat-line detector: window length in samples; flag when the window's standard deviation is
# below flat_sigma_factor times the sensor noise standard deviation.
flat_window_samples: 18
flat_sigma_factor: 0.3

# ---------------------------------------------------------------------------------------------
# Phase 3B: the "twin out of date" self-check. Every value is
# placeholder, not sourced [SOURCE NEEDED]; tuned on the TRAINING seeds only (decision 0006).
# ---------------------------------------------------------------------------------------------
# The monitor fits  y = g * x + b * dt_h  over a rolling window, where x is the change the twin
# predicts for one interval and y the change that was observed. A box that differs from the
# calibration shows a gain g away from 1, with no jump. Window length in samples:
ood_window_samples: 72
# The verdict twin_out_of_date needs |g - 1| above this margin ...
ood_gain_margin: 0.08
# ... with g inside this plausible band (outside it the shape is not a mismatch) ...
ood_gain_band_low: 0.5
ood_gain_band_high: 2.0
# ... for this many window evaluations in a row (and it clears after as many back inside).
ood_sustained_samples: 6
# The gain is only judged when it can be measured: its standard error must not exceed this.
ood_max_gain_se: 0.04

# When the monitor declares the reported data untrusted, the worst-case bound starts this many
# samples before the first evidence, so a lie that began before it was noticed is covered.
trust_lookback_samples: 6

# Phase 3C: safety factor sf on the twin's time constant in the HIGH worst-case bound (0 < sf <= 1).
# The bound integrates the twin with tau * sf: a box that tracks the ambient faster is at an
# equal or higher temperature, so a smaller sf can only make the bound higher (safer, looser).
# Rule (chosen on the TRAINING seeds): the largest sf in {1.0, 0.9, 0.8, 0.7, 0.6} with zero
# violations in every lie family on the nominal box and the +15 and -15 percent boxes.
# placeholder, not sourced [SOURCE NEEDED]
# Chosen on the training seeds 10001-10100 (sweep in docs/02-phase-reports/phase-03c-evaluation.md):
# 1.0 gave 66 violations on the -15 percent box; 0.9 is the largest factor with none.
bound_tau_safety_factor: 0.9
