id: reefer_failure
title: Cooling failure in a hot cargo area
description: The cooling unit stops working part way through the trip while the cargo area around the box is very hot, like a closed cargo space heated by the sun. The box warms steadily and keeps warming until it is well beyond its allowed range.
seed: 103
duration_h: 36
sample_interval_s: 600
# placeholder, not sourced [SOURCE NEEDED]: temperatures, times and shift below.
# "ambient" is the temperature of the cargo area around the box (a sun-heated closed space).
ambient:
  - [0, 22]
  - [10, 32]
  - [20, 46]
  - [30, 50]
  - [36, 48]
ambient_jitter_c: 2
ambient_shift_h: 2
rh_base_pct: 45
events:
  - type: cooling_factor
    start_h: {min: 8, max: 12}
    end_h: 36
    factor: 0.0
expect:
  true_max_c_gt: hard_limit_high_c
